<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#1A56DB"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="ועד בית פלוס"/>
  <title>ועד בית פלוס</title>
  <link rel="manifest" href="./manifest.json"/>
  <link rel="icon" href="./icon-192.png"/>
  <link rel="apple-touch-icon" href="./icon-192.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #1A56DB;
      --blue-dark: #1447B8;
      --blue-light: #EBF2FF;
      --green: #0E9F6E;
      --green-light: #E8F7F2;
      --red: #F05252;
      --red-light: #FDF2F2;
      --gray-50: #F9FAFB;
      --gray-100: #F3F4F6;
      --gray-200: #E5E7EB;
      --gray-300: #D1D5DB;
      --gray-500: #6B7280;
      --gray-700: #374151;
      --gray-900: #111827;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --radius: 12px;
    }

    body {
      font-family: 'Heebo', sans-serif;
      background-color: var(--gray-50);
      color: var(--gray-900);
      line-height: 1.5;
      padding-bottom: 80px;
    }

    /* Navbar */
    .navbar {
      background: white;
      border-bottom: 1px solid var(--gray-200);
      padding: 1rem;
      position: sticky;
      top: 0;
      z-index: 40;
      box-shadow: var(--shadow-sm);
    }
    .navbar-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--blue);
    }

    /* Container & Layout */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
    }

    /* Bottom Nav for Mobile */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 1px solid var(--gray-200);
      display: flex;
      justify-content: space-around;
      padding: 0.5rem 0;
      z-index: 50;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.75rem;
      color: var(--gray-500);
      text-decoration: none;
      cursor: pointer;
      border: none;
      background: none;
    }
    .nav-item.active {
      color: var(--blue);
      font-weight: 600;
    }

    /* Forms & Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.625rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background-color: var(--blue);
      color: white;
    }
    .btn-primary:hover {
      background-color: var(--blue-dark);
    }
    .card {
      background: white;
      border-radius: var(--radius);
      border: 1px solid var(--gray-200);
      padding: 1.25rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow-sm);
    }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="navbar-container">
      <div class="logo">🏢 ועד בית פלוס</div>
      <div id="user-info"></div>
    </div>
  </div>

  <div class="container" id="main-content">
    </div>

  <div class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('dashboard')">📊 דשבורד</button>
    <button class="nav-item" onclick="switchTab('payments')">💳 תשלומים</button>
    <button class="nav-item" onclick="switchTab('residents')">👥 דיירים</button>
    <button class="nav-item" onclick="switchTab('settings')">⚙️ הגדרות</button>
  </div>

  <script>
    // פונקציות עזר לתאריכים ומטבע
    const fmtCurrency = (amount) => new Intl.NumberFormat('he-IL', { style: 'currency', currency: 'ILS' }).format(amount || 0);
    const fmtDateDMY = (dateStr) => {
      if(!dateStr) return '';
      const d = new Date(dateStr);
      return isNaN(d.getTime()) ? dateStr : d.toLocaleDateString('he-IL');
    };
    const enumerateMonths = (from, to) => [from]; // לפשטות, מחזיר מערך חודשים
    const monthLabel = (m) => m;

    let buildingData = { address: "הרצל 1, תל אביב" };

    // הפונקציה המעודכנת להפקת קבלה ושליחה בווטסאפ
    window.generateReceipt = (payment, resident) => {
      const monthsStr = (payment.exceptionalTransfer && payment.monthFrom && payment.monthTo)
        ? enumerateMonths(payment.monthFrom, payment.monthTo).map(ym => monthLabel(ym)).join(', ')
        : monthLabel(payment.month || payment.monthFrom || '');

      // שליפת מספר הטלפון והכנה לווטסאפ
      const rawPhone = resident?.phone || payment?.phone || '';
      const cleanPhone = rawPhone.replace(/\D/g, ''); // ניקוי מקפים/רווחים
      const formattedPhone = cleanPhone.startsWith('0') ? '972' + cleanPhone.slice(1) : cleanPhone;
      
      // ניסוח הטקסט שיופיע בצ'אט בווטסאפ
      const textMessage = encodeURIComponent(
        `שלום ${resident?.name || 'דייר דירה ' + (payment.aptNum || payment.apt || '')},\n` +
        `מצורפת קבלה על סך ${fmtCurrency(payment.amount)} עבור דמי ועד בית לחודש/ים: ${monthsStr}.\n` +
        `תודה רבה!`
      );

      const whatsappUrl = formattedPhone 
        ? `https://wa.me/${formattedPhone}?text=${textMessage}` 
        : `https://wa.me/?text=${textMessage}`;

      const html = `
        <!DOCTYPE html>
        <html lang="he" dir="rtl">
        <head>
          <meta charset="utf-8">
          <title>קבלה על תשלום דמי ועד בית</title>
          <style>
            body { font-family: 'Heebo', sans-serif; padding: 40px; color: #1F2937; max-width: 600px; margin: 0 auto; }
            .receipt-box { border: 2px solid #E5E7EB; border-radius: 14px; padding: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
            .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1A56DB; padding-bottom: 15px; margin-bottom: 25px; }
            .title { font-size: 24px; font-weight: 800; color: #1A56DB; }
            .meta { font-size: 14px; color: #4B5563; text-align: left; }
            .row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 15px; border-bottom: 1px dashed #F3F4F6; padding-bottom: 8px; }
            .label { font-weight: 600; color: #4B5563; }
            .val { color: #1F2937; text-align: left; }
            .total-row { background: #EBF2FF; padding: 12px; border-radius: 8px; margin-top: 20px; font-size: 18px; font-weight: 700; color: #1A56DB; }
            .footer { text-align: center; margin-top: 30px; font-size: 12px; color: #9CA3AF; }
            
            /* כפתורי הדפסה ושליחה */
            .btn-container { display: flex; gap: 10px; margin-top: 20px; }
            .btn-print { background: #1A56DB; color: white; border: none; padding: 12px 20px; font-family: 'Heebo', sans-serif; font-size: 14px; font-weight: 600; border-radius: 8px; cursor: pointer; flex: 1; }
            .btn-whatsapp { background: #25D366; color: white; text-decoration: none; text-align: center; padding: 12px 20px; font-family: 'Heebo', sans-serif; font-size: 14px; font-weight: 600; border-radius: 8px; flex: 1; display: inline-block; }
            
            @media print {
              body { padding: 0; }
              .receipt-box { border: none; box-shadow: none; }
              .btn-container { display: none; } /* הסתרת הכפתורים בהדפסה/PDF */
            }
          </style>
        </head>
        <body>
          <div class="receipt-box">
            <div class="header">
              <div class="title">🧾 קבלה על תשלום</div>
              <div class="meta">
                <div><strong>ועד הבית:</strong> ${buildingData?.address || ''}</div>
                <div><strong>תאריך הפקה:</strong> ${fmtDateDMY(payment.actualDate || payment.createdAt?.toDate()?.toISOString()?.split('T')[0] || '')}</div>
              </div>
            </div>
            
            <div class="row"><span class="label">נתקבל מאת:</span><span class="val">${resident?.name || 'דייר דירה ' + (payment.aptNum || payment.apt || '')}</span></div>
            <div class="row"><span class="label">עבור דירה:</span><span class="val">${payment.aptNum || payment.apt || ''}</span></div>
            <div class="row"><span class="label">עבור החודשים:</span><span class="val">${monthsStr}</span></div>
            <div class="row"><span class="label">אופן התשלום:</span><span class="val">${
              payment.method === 'transfer' ? '💳 העברה בנקאית' :
              payment.method === 'standingOrder' ? '🔁 הוראת קבע' :
              payment.method === 'cash' ? '💵 מזומן' : '🧾 שיק'
            }</span></div>
            ${payment.note ? `<div class="row"><span class="label">הערות:</span><span class="val">${payment.note}</span></div>` : ''}
            
            <div class="row total-row"><span class="label" style="color:#1A56DB;">סה"כ שולם:</span><span class="val">${fmtCurrency(payment.amount)}</span></div>
            
            <div class="footer">תודה רבה! הופק באמצעות אפליקציית "ועד בית פלוס"</div>
            
            <div class="btn-container">
              <button class="btn-print" onclick="window.print()">🖨️ שמור כ-PDF / הדפס</button>
              <a class="btn-whatsapp" href="${whatsappUrl}" target="_blank">💬 שלח ב-WhatsApp</a>
            </div>
          </div>
        </body>
        </html>
      `;

      const win = window.open('', '_blank');
      win.document.write(html);
      win.document.close();
    };

    function switchTab(tabName) {
      const content = document.getElementById('main-content');
      if(tabName === 'dashboard') {
        content.innerHTML = `
          <div class="card">
            <h2>ברוכים הבאים לוועד בית פלוס</h2>
            <p style="margin-top: 10px;">לחץ על הפקת קבלה להדגמה:</p>
            <button class="btn btn-primary" style="margin-top:15px;" onclick="demoReceipt()">🧾 הפק קבלה לדוגמה</button>
          </div>
        `;
      }
    }

    function demoReceipt() {
      const samplePayment = { aptNum: '4', amount: 250, monthFrom: '2024-01', method: 'transfer', note: 'תשלום בזמן' };
      const sampleResident = { name: 'ישראל ישראלי', phone: '0501234567' };
      window.generateReceipt(samplePayment, sampleResident);
    }

    // טעינת לשונית ברירת מחדל
    switchTab('dashboard');
  </script>
</body>
</html>
